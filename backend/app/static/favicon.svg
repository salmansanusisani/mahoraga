<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="12" fill="#000000"/>
  
  <!-- Outer Wheel Rim -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#555555" stroke-width="1"/>

  <!-- 8 Radial Spokes and Outer Spheres -->
  <!-- Top (0 deg) -->
  <line x1="32" y1="24" x2="32" y2="7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="7" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Top-Right (45 deg) -->
  <line x1="26.3" y1="26.3" x2="49.7" y2="14.3" stroke="#ffffff" stroke-width="2"/>
  <circle cx="49.7" cy="14.3" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Right (90 deg) -->
  <line x1="40" y1="32" x2="57" y2="32" stroke="#ffffff" stroke-width="2"/>
  <circle cx="57" cy="32" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Bottom-Right (135 deg) -->
  <line x1="37.7" y1="37.7" x2="49.7" y2="49.7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="49.7" cy="49.7" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Bottom (180 deg) -->
  <line x1="32" y1="40" x2="32" y2="57" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="57" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Bottom-Left (225 deg) -->
  <line x1="26.3" y1="37.7" x2="14.3" y2="49.7" stroke="#ffffff" stroke-width="2"/>
  <circle cx="14.3" cy="49.7" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Left (270 deg) -->
  <line x1="24" y1="32" x2="7" y2="32" stroke="#ffffff" stroke-width="2"/>
  <circle cx="7" cy="32" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Top-Left (315 deg) -->
  <line x1="26.3" y1="26.3" x2="14.3" y2="14.3" stroke="#ffffff" stroke-width="2"/>
  <circle cx="14.3" cy="14.3" r="3.5" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>

  <!-- Center Hub -->
  <circle cx="32" cy="32" r="8" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
